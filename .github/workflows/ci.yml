name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  ci:
    uses: Bria-AI/github-workflows/.github/workflows/python-package-ci.yml@main
    with:
      package-name: vgl
    secrets: inherit
