name: Publish to PyPI

on:
  release:
    types: [published]

# Python releases are tagged `vX.Y.Z` (no component prefix).
jobs:
  pypi:
    name: Publish to PyPI
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write   # OIDC token for PyPI trusted publishing
      contents: write   # attach the wheel to the GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        # No credentials: uv uses GitHub OIDC trusted publishing (configured on PyPI).
        run: uv publish --trusted-publishing always
      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
